<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BLASSA Studio — form registration</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      This file exists so Netlify's build-time form detection can register these
      forms. TanStack Start renders its forms with React, which the crawler never
      sees. The React components POST here; visitors never see this page.
      Field names must stay in sync with the components in src/components.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>

    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
    </form>
  </body>
</html>
